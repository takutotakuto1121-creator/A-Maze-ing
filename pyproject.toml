[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
authors = [
  { name="Your Name", email="your.email@example.com" },
]
description = "A-Maze-ing maze generator module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "numpy",
]

[tool.setuptools]
packages = ["mazegen"]
